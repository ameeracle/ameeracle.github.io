
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ameeracle | المشاريع</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --mario-sky: #5c94fc;
      --mario-brick: #b84418;
      --mario-ground: #d8a038;
      --mario-white: #ffffff;
      --mario-black: #000000;
    }

    * {
      box-sizing: border-box;
      image-rendering: pixelated;
    }

    body {
      margin: 0;
      padding: 40px 16px 80px;
      background-color: var(--mario-sky);
      color: var(--mario-white);
      font-family: 'Silkscreen', 'Tahoma', sans-serif;
      text-align: center;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.15;
      background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 30px;
    }

    h1 {
      font-family: 'Press Start 2P', sans-serif;
      font-size: clamp(20px, 5vw, 36px);
      margin: 0 0 12px 0;
      color: #f8b800;
      text-shadow: 4px 4px 0px var(--mario-black);
    }

    .subtitle {
      font-size: 15px;
      margin: 0;
      text-shadow: 2px 2px 0px var(--mario-black);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px;
      align-items: start;
    }

    .card {
      background: #181818;
      border: 4px solid var(--mario-black);
      padding: 18px 14px;
      box-shadow: 0 8px 0px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.1s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card h2 {
      font-size: 18px;
      margin: 0 0 14px 0;
      color: #ffe9a6;
      text-shadow: 2px 2px 0px var(--mario-black);
    }

    .screen-wrapper {
      border: 4px solid #404040;
      background: var(--mario-black);
      aspect-ratio: 9 / 16;
      overflow: hidden;
      margin: 0 auto 16px;
      max-width: 220px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .screen-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn {
      display: block;
      background-color: var(--mario-brick);
      color: var(--mario-white);
      border: 4px solid var(--mario-black);
      padding: 12px 10px;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: inset -4px -4px 0px #802000, inset 4px 4px 0px #ff6633;
      text-shadow: 2px 2px 0px var(--mario-black);
    }

    .btn:active {
      box-shadow: inset 4px 4px 0px #802000;
      transform: translateY(2px);
    }

    .mario-floor {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 24px;
      background: linear-gradient(90deg, #50b800 50%, #409800 50%);
      background-size: 24px 100%;
      border-top: 4px solid var(--mario-black);
      z-index: 10;
    }

    @media (max-width: 820px) {
      .grid {
        grid-template-columns: 1fr;
        max-width: 320px;
        margin: 0 auto;
        gap: 34px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>AMEERACLE</h1>
      <p class="subtitle">اختر الوجهة لبدء تشغيل التطبيق!</p>
    </header>

    <main class="grid">
      <article class="card">
        <div>
          <h2>ZaWordle</h2>
          <div class="screen-wrapper">
            <img src="assets/zawrd.jpg" alt="ZaWordle Mobile View">
          </div>
        </div>
        <a href="ZaWordle/" class="btn">START GAME</a>
      </article>

      <article class="card">
        <div>
          <h2>LogicLock</h2>
          <div class="screen-wrapper">
            <img src="assets/logiclock.webp" alt="LogicLock Mobile View">
          </div>
        </div>
        <a href="logiclock/" class="btn">START GAME</a>
      </article>

      <article class="card">
        <div>
          <h2>Azan Plus</h2>
          <div class="screen-wrapper">
            <img src="assets/screen-home.jpg" alt="Azan Plus Mobile View">
          </div>
        </div>
        <a href="azanplus/" class="btn">OPEN APP</a>
      </article>
        <article class="card">
        <div>
          <h2>ِAura HxH</h2>
          <div class="screen-wrapper">
            <img src="https://i.quotev.com/omxo53phaaaa.jpg" alt="Nen test web quize">
          </div>
        </div>
        <a href="hxh/" class="btn">START TEST</a>
      </article>
    </main>
  </div>

  <div class="mario-floor" aria-hidden="true"></div>

</body>
</html>
